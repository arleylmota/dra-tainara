<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f3ef">
<meta name="description" content="Dra. Tainara Rodrigues — Ultrassonografia.">
<title>Dra. Tainara Rodrigues | Ultrassonografia</title>
<style>
:root{--bg:#f5f3ef;--ink:#1f2927;--muted:#68736f;--card:rgba(255,255,255,.72);--line:rgba(31,41,39,.10);--accent:#315c54;--accent2:#274b45}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
body{background:radial-gradient(circle at 50% -10%,#fff 0,#f5f3ef 45%,#eae8e2 100%);display:flex;justify-content:center}
main{width:100%;max-width:520px;min-height:100vh;padding:42px 22px 28px;display:flex;flex-direction:column;align-items:center}
.profile{text-align:center;margin-top:12px}
.avatar{width:92px;height:92px;border-radius:50%;margin:auto;background:linear-gradient(145deg,#e9eee9,#d4dfda);display:grid;place-items:center;box-shadow:0 14px 35px rgba(39,75,69,.13);border:1px solid rgba(255,255,255,.9);font-size:30px;font-weight:700;color:var(--accent)}
h1{font-family:Georgia,serif;font-size:30px;letter-spacing:-.7px;margin:20px 0 7px;font-weight:600}
.role{font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.bio{font-size:14px;line-height:1.6;color:var(--muted);max-width:350px;margin:15px auto 25px}
.links{width:100%;display:grid;gap:12px}
.link{display:flex;align-items:center;justify-content:center;gap:11px;text-decoration:none;color:white;background:linear-gradient(135deg,var(--accent),var(--accent2));padding:17px 20px;border-radius:18px;font-size:15px;font-weight:650;box-shadow:0 12px 28px rgba(39,75,69,.18);transition:.18s transform,.18s box-shadow}
.link:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(39,75,69,.22)}
.icon{width:20px;height:20px;display:grid;place-items:center;font-size:18px}
.note{margin-top:22px;font-size:11px;color:#8a928f;letter-spacing:.08em;text-transform:uppercase}
footer{margin-top:auto;padding-top:55px;color:#9aa19e;font-size:11px}
@media(prefers-reduced-motion:reduce){.link{transition:none}}
</style>
</head>
<body>
<main>
<section class="profile">
<div class="avatar" aria-hidden="true">TR</div>
<h1>Dra. Tainara Rodrigues</h1>
<div class="role">Ultrassonografia</div>
<p class="bio">Cuidado, precisão e tecnologia em diagnóstico por imagem.</p>
</section>
<nav class="links" aria-label="Contato">
<a class="link" href="tel:+557799918361"><span class="icon">☎</span><span>Ligar para +55 77 9991-8361</span></a>
</nav>
<div class="note">Contato profissional</div>
<footer>© 2026 Dra. Tainara Rodrigues</footer>
</main>
</body>
</html>
