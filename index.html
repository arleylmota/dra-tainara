<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f4ef">
<meta name="description" content="Dra. Tainara Rodrigues — Ultrassonografia — CRM-BA 43828. Cuidado, precisão e tecnologia em diagnóstico por imagem.">
<meta property="og:title" content="Dra. Tainara Rodrigues | Ultrassonografia">
<meta property="og:description" content="Cuidado, precisão e tecnologia em diagnóstico por imagem. CRM-BA 43828.">
<meta property="og:type" content="profile">
<meta property="og:image" content="tainara.jpg">
<link rel="icon" type="image/png" href="logo-tr-watermark.png">
<title>Dra. Tainara Rodrigues | Ultrassonografia</title>
<style>
:root{
  --bg:#f5f4ef;--paper:rgba(255,255,255,.68);--ink:#1f2927;--muted:#6b7268;
  --accent:#2c4a3e;--accent2:#344e43;--line:rgba(44,74,62,.14);
  --serif:Georgia,"Times New Roman",serif;
  --sans:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
html{min-height:100%}
body{
  margin:0;min-height:100vh;color:var(--ink);
  font-family:var(--sans);
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;padding:26px 20px;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
main{
  position:relative;z-index:1;
  width:100%;max-width:480px;
  display:flex;flex-direction:column;align-items:center;
  padding:0 4px 26px;
}
.profile{text-align:center;width:100%;display:flex;flex-direction:column;align-items:center}
.avatarWrap{position:relative;display:flex;align-items:center;justify-content:center}
.echo{position:absolute;inset:-22px;display:grid;place-items:center;pointer-events:none}
.echo svg{width:min(340px,100vw);height:min(340px,100vw)}
.echo circle{
  fill:none;stroke:var(--accent);stroke-width:1;
  transform-box:fill-box;transform-origin:center;
  animation:echo 7s ease-out infinite;opacity:0;
}
.echo circle:nth-child(2){animation-delay:2.33s}
.echo circle:nth-child(3){animation-delay:4.66s}
@keyframes echo{
  0%{transform:scale(.55);opacity:0}
  16%{opacity:.16}
  68%{transform:scale(1.12);opacity:0}
  100%{transform:scale(1.12);opacity:0}
}
.avatar{
  width:150px;height:150px;border-radius:30px;margin:0 auto;
  overflow:hidden;
  box-shadow:0 18px 40px rgba(44,74,62,.14);
  border:3px solid rgba(255,255,255,.95);background:#efeae2;
  cursor:zoom-in;position:relative;
}
.avatar img{width:100%;height:100%;display:block;object-fit:cover;object-position:center top}
.avatar::after{
  content:"⌕";position:absolute;right:7px;bottom:7px;width:30px;height:30px;
  border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.94);
  color:var(--accent);font-size:17px;line-height:1;box-shadow:0 4px 12px rgba(0,0,0,.08);
}
.rule{height:1px;width:60px;background:var(--line);margin:14px auto}
.name{
  font-family:var(--serif);font-size:clamp(28px,7vw,35px);letter-spacing:-.5px;
  line-height:1.05;margin:0 0 3px;font-weight:600;color:#1c2421;
}
.crm{
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:#7a827a;margin-top:3px;font-weight:650;
}
.role{
  margin:9px 0 0;color:var(--accent);font-size:clamp(17px,3.4vw,21px);
  line-height:1.1;letter-spacing:.03em;text-transform:uppercase;font-weight:750;
}
.bio{
  font-size:13.5px;line-height:1.55;color:var(--muted);
  max-width:330px;margin:8px auto 0;text-align:center;
}
.links{
  width:100%;max-width:360px;display:flex;flex-direction:column;gap:11px;
  margin-top:24px;
}
.link{
  flex:1;min-height:50px;display:flex;align-items:center;justify-content:center;gap:11px;
  text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));
  padding:12px 18px;border-radius:999px;font-size:14px;font-weight:650;
  box-shadow:0 10px 24px rgba(44,74,62,.13);
  transition:transform .16s ease,box-shadow .16s ease;
}
.link:hover{transform:translateY(-2px);box-shadow:0 13px 28px rgba(44,74,62,.17)}
.link:focus-visible{outline:3px solid rgba(44,74,62,.32);outline-offset:3px}
.icon{width:20px;height:20px;display:grid;place-items:center;flex:0 0 20px}
.icon svg{width:19px;height:19px;fill:currentColor}
.link.instagram{background:linear-gradient(135deg,#3b2b4e,#7d3e67 58%,#b76a55);box-shadow:0 10px 24px rgba(125,62,103,.13)}
.share{
  margin-top:14px;display:inline-flex;align-items:center;gap:8px;
  background:none;border:0;cursor:pointer;color:var(--ink);
  font:inherit;font-size:13px;font-weight:600;letter-spacing:.01em;
  padding:9px 15px;border-radius:999px;transition:color .16s ease;
}
.share:hover{color:var(--accent)}
.share:focus-visible{outline:3px solid rgba(44,74,62,.32);outline-offset:3px}
.share svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);
  background:#1f2927;color:#fff;font-size:12.5px;font-weight:600;padding:9px 16px;
  border-radius:999px;opacity:0;pointer-events:none;z-index:1200;
  transition:opacity .22s ease,transform .22s ease;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.watermark{
  position:fixed;right:22px;bottom:16px;width:110px;height:110px;
  display:flex;align-items:center;justify-content:center;opacity:.09;pointer-events:none;z-index:0;
}
.watermark img{width:100%;height:100%;object-fit:contain;display:block}
footer{
  margin-top:8px;color:#7c8580;font-size:11px;letter-spacing:.02em;
}
footer a{color:inherit;text-decoration:none}
footer a:hover{color:var(--accent);text-decoration:underline}
.lightbox{
  position:fixed;inset:0;z-index:1000;background:rgba(15,22,20,.82);
  display:none;align-items:center;justify-content:center;padding:22px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.lightbox.open{display:flex}
.lightbox img{
  max-width:min(92vw,880px);max-height:88vh;width:auto;height:auto;
  object-fit:contain;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.42);
}
.close{
  position:absolute;top:12px;right:12px;width:40px;height:40px;border:0;border-radius:50%;
  background:rgba(255,255,255,.95);color:#1f2927;font-size:26px;line-height:1;cursor:pointer;
  transition:background .16s ease;
}
.close:hover{background:#fff}
@media(min-width:640px){
  main{padding:0 8px 30px}
  .avatar{width:168px;height:168px}
  .links{gap:12px}
  .link{min-height:54px;padding:14px 20px;font-size:14.5px}
  .watermark{right:26px;bottom:18px;width:120px;height:120px}
}
@media(max-width:400px){
  body{padding:18px 14px}
  .avatar{width:138px;height:138px}
  .name{font-size:26px}
  .role{font-size:16px}
  .link{padding:11px 15px;font-size:13.5px}
  .watermark{width:88px;height:88px;right:16px;bottom:14px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .link,.share,.close,.avatar,.watermark{transition:none}
  .echo circle{animation:none;opacity:.12}
}
</style>
</head>
<body>
<main>
<section class="profile">
  <div class="avatarWrap">
    <div class="echo" aria-hidden="true">
      <svg viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="52"/>
        <circle cx="100" cy="100" r="70"/>
        <circle cx="100" cy="100" r="86"/>
      </svg>
    </div>
    <div class="avatar" id="photoTrigger" role="button" tabindex="0" aria-label="Ampliar foto da Dra. Tainara Rodrigues">
      <img src="tainara.jpg" alt="Dra. Tainara Rodrigues">
    </div>
  </div>

  <h1 class="name">Dra. Tainara Rodrigues</h1>

  <div class="role">Ultrassonografia</div>

  <p class="bio">Cuidado, precisão e tecnologia em diagnóstico por imagem.</p>
  <div class="rule" aria-hidden="true"></div>
</section>

<nav class="links" aria-label="Contato e redes sociais">
  <a class="link instagram" href="https://www.instagram.com/tainarards/" target="_blank" rel="noopener noreferrer">

    <span>Instagram</span>
  </a>
  <a class="link whatsapp" href="https://wa.me/557799918361" target="_blank" rel="noopener noreferrer">
    <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg></span>

<button class="share" id="shareBtn" type="button" aria-label="Compartilhar o link desta página">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m0 0L8 8m4-4 4 4"/><path d="M5 12v7a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-7"/></svg>
  <span>Compartilhar este link</span>
</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<footer>© <span id="year">2026</span> <a href="https://dra-tainara-rodrigues.pages.dev/">Dra. Tainara Rodrigues</a></footer>
</main>

<div class="watermark" aria-hidden="true"><img src="logo-tr-watermark.png" alt=""></div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Foto ampliada">
  <button class="close" id="closeLightbox" aria-label="Fechar">×</button>
  <img src="tainara.jpg" alt="Dra. Tainara Rodrigues — foto ampliada">
</div>

<script>
const trigger=document.getElementById('photoTrigger');
const box=document.getElementById('lightbox');
const close=document.getElementById('closeLightbox');
function openPhoto(){box.classList.add('open');document.body.style.overflow='hidden';close.focus()}
function closePhoto(){box.classList.remove('open');document.body.style.overflow=''}
trigger.addEventListener('click',openPhoto);
trigger.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPhoto()}});
close.addEventListener('click',closePhoto);
box.addEventListener('click',e=>{if(e.target===box)closePhoto()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&box.classList.contains('open'))closePhoto()});

const shareBtn=document.getElementById('shareBtn');
const toast=document.getElementById('toast');
let toastTimer;
function showToast(msg){
  toast.textContent=msg;toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.classList.remove('show'),2200);
}
shareBtn.addEventListener('click',async()=>{
  const data={title:document.title,text:'Dra. Tainara Rodrigues — Ultrassonografia',url:'https://dra-tainara-rodrigues.pages.dev/'};
  try{
    if(navigator.share){await navigator.share(data);return}
    throw new Error('no-share');
  }catch(err){
    if(err&&err.name==='AbortError')return;
    try{
      await navigator.clipboard.writeText(data.url);
      showToast('Link copiado!');
    }catch(e){
      showToast(data.url);
    }
  }
});

document.getElementById('year').textContent=new Date().getFullYear();
</script>
</body>
</html>
