<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f2ed">
<meta name="description" content="Dra. Tainara Rodrigues — Ultrassonografia — CRM-BA 43828. Cuidado, precisão e tecnologia em diagnóstico por imagem.">
<meta property="og:title" content="Dra. Tainara Rodrigues | Ultrassonografia">
<meta property="og:description" content="Cuidado, precisão e tecnologia em diagnóstico por imagem. CRM-BA 43828.">
<meta property="og:type" content="profile">
<meta property="og:image" content="tainara.jpg">
<link rel="icon" type="image/png" href="logo-tr-watermark.png">
<title>Dra. Tainara Rodrigues | Ultrassonografia</title>
<style>
:root{
  --bg:#f4f2ed;--paper:rgba(255,255,255,.68);--ink:#1f2927;--muted:#68736f;
  --accent:#315c54;--accent2:#244942;--line:rgba(49,92,84,.12);
}
*{box-sizing:border-box}
html{min-height:100%;scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;color:var(--ink);
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 50% -5%,#fff 0,#f7f5f1 35%,#e9e7e1 100%);
  display:flex;justify-content:center;
}
main{
  position:relative;z-index:1;
  width:100%;max-width:760px;min-height:100vh;
  padding:clamp(34px,7vh,72px) 24px 32px;
  display:flex;flex-direction:column;align-items:center;
}
.profile{text-align:center;width:100%;max-width:560px}
.avatar{
  width:210px;height:210px;border-radius:30px;margin:auto;overflow:hidden;
  box-shadow:0 22px 52px rgba(39,75,69,.17);
  border:4px solid rgba(255,255,255,.96);background:#e9ece9;
  cursor:zoom-in;position:relative;
}
.avatar img{width:100%;height:100%;display:block;object-fit:contain;object-position:center}
.avatar::after{
  content:"⌕";position:absolute;right:10px;bottom:10px;width:34px;height:34px;
  border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.9);
  color:var(--accent);font-size:20px;box-shadow:0 5px 16px rgba(0,0,0,.12);
}
h1{
  font-family:Georgia,serif;font-size:clamp(31px,5vw,43px);letter-spacing:-1px;
  line-height:1.1;margin:22px 0 7px;font-weight:600;
}
.crm{
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:#7a8581;margin-top:4px;font-weight:650;
}
.role{
  margin:14px 0 0;color:var(--accent);font-size:clamp(20px,3vw,25px);
  line-height:1.15;font-weight:750;letter-spacing:.06em;text-transform:uppercase;
}
.bio{
  font-size:15px;line-height:1.65;color:var(--muted);max-width:470px;
  margin:14px auto 30px;
}
.links{width:100%;max-width:560px;display:grid;gap:14px}
.link{
  min-height:60px;display:flex;align-items:center;justify-content:center;gap:12px;
  text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));
  padding:16px 22px;border-radius:18px;font-size:15px;font-weight:700;
  box-shadow:0 12px 30px rgba(39,75,69,.17);
  transition:transform .18s ease,box-shadow .18s ease;
}
.link:hover{transform:translateY(-2px);box-shadow:0 17px 36px rgba(39,75,69,.22)}
.link:focus-visible{outline:3px solid rgba(49,92,84,.28);outline-offset:4px}
.icon{width:22px;height:22px;display:grid;place-items:center}
.icon svg{width:21px;height:21px;fill:currentColor}
.link.instagram{background:linear-gradient(135deg,#3b2b4e,#7d3e67 58%,#b76a55);box-shadow:0 12px 30px rgba(125,62,103,.16)}
.watermark{
  position:fixed;right:26px;bottom:20px;width:118px;height:118px;
  display:flex;align-items:center;justify-content:center;opacity:.13;pointer-events:none;z-index:0;
}
.watermark img{width:100%;height:100%;object-fit:contain;display:block}
.note{margin-top:18px;font-size:10px;color:#8b9390;letter-spacing:.12em;text-transform:uppercase}
footer{margin-top:auto;padding-top:55px;color:#9aa19e;font-size:11px}

/* Tema ultrassonografia: eco de pulsos atrás da foto */
.avatarWrap{position:relative}
.echo{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.echo svg{width:min(360px,96vw);height:min(360px,96vw)}
.echo circle{
  fill:none;stroke:var(--accent);stroke-width:1.2;
  transform-box:fill-box;transform-origin:center;
  animation:echo 5s ease-out infinite;opacity:0;
}
.echo circle:nth-child(2){animation-delay:1.66s}
.echo circle:nth-child(3){animation-delay:3.33s}
@keyframes echo{
  0%{transform:scale(.55);opacity:0}
  18%{opacity:.22}
  70%{transform:scale(1.1);opacity:0}
  100%{transform:scale(1.1);opacity:0}
}

/* Onda de sinal entre o perfil e os links */
.wave{width:120px;color:var(--accent);opacity:.4;margin:-8px auto 26px}
.wave svg{display:block;width:100%;height:auto}

/* Compartilhar link */
.share{
  margin-top:16px;display:inline-flex;align-items:center;gap:8px;
  background:none;border:0;cursor:pointer;color:var(--muted);
  font:inherit;font-size:13px;font-weight:600;letter-spacing:.02em;
  padding:10px 16px;border-radius:999px;transition:color .18s ease;
}
.share:hover{color:var(--accent)}
.share:focus-visible{outline:3px solid rgba(49,92,84,.28);outline-offset:3px}
.share svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
  background:#1f2927;color:#fff;font-size:13px;font-weight:600;padding:10px 18px;
  border-radius:999px;opacity:0;pointer-events:none;z-index:1200;
  transition:opacity .25s ease,transform .25s ease;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Visualização ampliada da foto */
.lightbox{
  position:fixed;inset:0;z-index:1000;background:rgba(15,22,20,.82);
  display:none;align-items:center;justify-content:center;padding:24px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.lightbox.open{display:flex}
.lightbox img{
  max-width:min(92vw,900px);max-height:88vh;width:auto;height:auto;
  object-fit:contain;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.4);
}
.close{
  position:absolute;top:18px;right:18px;width:44px;height:44px;border:0;border-radius:50%;
  background:rgba(255,255,255,.94);color:#1f2927;font-size:28px;line-height:1;cursor:pointer;
}
@media(min-width:700px){
  main{padding-top:9vh}.avatar{width:230px;height:230px}
  .links{gap:15px}.link{min-height:64px;border-radius:20px;font-size:16px}
}
@media(max-width:480px){
  main{padding-left:18px;padding-right:18px}.avatar{width:190px;height:190px}
  h1{font-size:30px}.role{font-size:20px}.bio{font-size:14px;margin-bottom:25px}
  .link{min-height:57px;border-radius:16px;font-size:14px}
  .watermark{right:18px;bottom:14px;width:88px;height:88px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}.link{transition:none}
  .echo circle{animation:none;opacity:.12}
}
</style>
</head>
<body>
<main>
<section class="profile">
  <div class="avatarWrap">
    <div class="echo" aria-hidden="true">
      <svg viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="55"/>
        <circle cx="100" cy="100" r="70"/>
        <circle cx="100" cy="100" r="85"/>
      </svg>
    </div>
    <div class="avatar" id="photoTrigger" role="button" tabindex="0" aria-label="Ampliar foto da Dra. Tainara Rodrigues">
      <img src="tainara.jpg" alt="Dra. Tainara Rodrigues">
    </div>
  </div>
  <h1>Dra. Tainara Rodrigues</h1>
  <div class="crm">CRM-BA 43828</div>
  <div class="role">Ultrassonografia</div>
  <p class="bio">Cuidado, precisão e tecnologia em diagnóstico por imagem.</p>
  <div class="wave" aria-hidden="true">
    <svg viewBox="0 0 120 24">
      <path d="M2 12c8-11 16-11 24 0s16 11 24 0 16-11 24 0 16 11 24 0 16-11 22 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </div>
</section>

<nav class="links" aria-label="Contato e redes sociais">
  <a class="link instagram" href="https://www.instagram.com/tainarards/" target="_blank" rel="noopener noreferrer">
    <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9a5.5 5.5 0 0 1-5.5 5.5h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2Zm0 2A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9a3.5 3.5 0 0 0 3.5-3.5v-9A3.5 3.5 0 0 0 16.5 4h-9ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm5.25-3.25a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5Z"/></svg></span>
    <span>Instagram</span>
  </a>
  <a class="link whatsapp" href="https://wa.me/557799918361" target="_blank" rel="noopener noreferrer">
    <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg></span><span>Falar pelo WhatsApp</span>

<button class="share" id="shareBtn" type="button" aria-label="Compartilhar o link desta página">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m0 0L8 8m4-4 4 4"/><path d="M5 12v7a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-7"/></svg>
  <span>Compartilhar este link</span>
</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<footer>© 2026 Dra. Tainara Rodrigues</footer>
</main>
<div class="watermark" aria-hidden="true"><img src="logo-tr-watermark.png" alt=""></div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Foto ampliada">
  <button class="close" id="closeLightbox" aria-label="Fechar">×</button>
  <img src="tainara.jpg" alt="Dra. Tainara Rodrigues — foto ampliada">
</div>

<script>
const trigger=document.getElementById('photoTrigger');
const box=document.getElementById('lightbox');
const close=document.getElementById('closeLightbox');
function openPhoto(){box.classList.add('open');document.body.style.overflow='hidden';close.focus()}
function closePhoto(){box.classList.remove('open');document.body.style.overflow=''}
trigger.addEventListener('click',openPhoto);
trigger.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPhoto()}});
close.addEventListener('click',closePhoto);
box.addEventListener('click',e=>{if(e.target===box)closePhoto()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&box.classList.contains('open'))closePhoto()});

/* Compartilhar link da página */
const shareBtn=document.getElementById('shareBtn');
const toast=document.getElementById('toast');
let toastTimer;
function showToast(msg){
  toast.textContent=msg;toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.classList.remove('show'),2200);
}
shareBtn.addEventListener('click',async()=>{
  const data={title:document.title,text:'Dra. Tainara Rodrigues — Ultrassonografia',url:'https://dra-tainara-rodrigues.pages.dev/'};
  try{
    if(navigator.share){await navigator.share(data);return}
    throw new Error('no-share');
  }catch(err){
    if(err&&err.name==='AbortError')return;
    try{
      await navigator.clipboard.writeText(data.url);
      showToast('Link copiado!');
    }catch(e){
      showToast(data.url);
    }
  }
});
</script>
</body>
</html>
