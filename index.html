<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f2ed"><meta name="description" content="Dra. Tainara Rodrigues — Ultrassonografia.">
<title>Dra. Tainara Rodrigues | Ultrassonografia</title>
<style>
:root{--bg:#f4f2ed;--ink:#1f2927;--muted:#68736f;--accent:#315c54;--accent2:#244942}
*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 50% -5%,#fff 0,#f7f5f1 35%,#e9e7e1 100%);display:flex;justify-content:center}
main{width:100%;max-width:760px;min-height:100vh;padding:clamp(34px,7vh,72px) 24px 32px;display:flex;flex-direction:column;align-items:center}
.profile{text-align:center;width:100%;max-width:560px}.avatar{width:104px;height:104px;border-radius:50%;margin:auto;background:linear-gradient(145deg,#eef2ee,#d3dfda);display:grid;place-items:center;box-shadow:0 18px 45px rgba(39,75,69,.14);border:1px solid rgba(255,255,255,.95);font-family:Georgia,serif;font-size:31px;font-weight:700;color:var(--accent)}
h1{font-family:Georgia,serif;font-size:clamp(30px,5vw,42px);letter-spacing:-1px;line-height:1.1;margin:22px 0 9px;font-weight:600}.role{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.bio{font-size:15px;line-height:1.65;color:var(--muted);max-width:430px;margin:15px auto 30px}.links{width:100%;max-width:560px;display:grid;gap:14px}
.link{min-height:58px;display:flex;align-items:center;justify-content:center;gap:11px;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));padding:16px 22px;border-radius:18px;font-size:15px;font-weight:650;box-shadow:0 12px 30px rgba(39,75,69,.17);transition:transform .18s ease,box-shadow .18s ease}
.link:hover{transform:translateY(-2px);box-shadow:0 17px 36px rgba(39,75,69,.22)}.link:focus-visible{outline:3px solid rgba(49,92,84,.28);outline-offset:4px}.icon{width:20px;height:20px;display:grid;place-items:center;font-size:18px}
.note{margin-top:23px;font-size:10px;color:#8b9390;letter-spacing:.12em;text-transform:uppercase}footer{margin-top:auto;padding-top:60px;color:#9aa19e;font-size:11px}
@media(min-width:700px){main{padding-top:9vh}.avatar{width:116px;height:116px}.links{gap:16px}.link{min-height:62px;border-radius:20px;font-size:16px}}
@media(max-width:480px){main{padding-left:18px;padding-right:18px}.avatar{width:88px;height:88px;font-size:27px}h1{font-size:29px}.bio{font-size:14px;margin-bottom:25px}.link{min-height:56px;border-radius:16px;font-size:14px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.link{transition:none}}
</style></head>
<body><main>
<section class="profile"><div class="avatar" aria-hidden="true">TR</div><h1>Dra. Tainara Rodrigues</h1><div class="role">Ultrassonografia</div><p class="bio">Cuidado, precisão e tecnologia em diagnóstico por imagem.</p></section>
<nav class="links" aria-label="Contato"><a class="link" href="tel:+557799918361"><span class="icon">☎</span><span>Ligar para +55 77 9991-8361</span></a></nav>
<div class="note">Contato profissional</div><footer>© 2026 Dra. Tainara Rodrigues</footer>
</main></body></html>
